name: Scrape Cinema Showtimes

on:
  schedule:
    - cron: '0 5 * * *'  # Ogni giorno alle 7:00 ora italiana (05:00 UTC)
  workflow_dispatch:       # Avvio manuale da GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze scraper
        run: cd scripts && npm install

      - name: Esegui scraper orari
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUPPETEER_SKIP_DOWNLOAD: 'false'
        run: node scripts/scrape-showtimes.js
