<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%"   stop-color="#111111"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>

    <!-- Gradiente stella: bianco caldo al centro → oro ai vertici -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#fffef0"/>
      <stop offset="25%"  stop-color="#f8e97a"/>
      <stop offset="60%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#b8941e"/>
    </radialGradient>

    <!-- Alone grande e morbido (halo esterno) -->
    <filter id="halo" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <!-- Glow medio sulla stella -->
    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bagliore core centrale -->
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow piccole stelle satellite -->
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sfondo nero arrotondato -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Alone esterno (halo dorato ampio) -->
  <circle cx="256" cy="256" r="155" fill="#D4AF37" opacity="0.22" filter="url(#halo)"/>

  <!-- Secondo strato alone (più caldo, più stretto) -->
  <circle cx="256" cy="256" r="90"  fill="#f5d776" opacity="0.18" filter="url(#halo)"/>

  <!-- Stella principale a 4 punte (sparkle) con glow -->
  <!--
    Path: stella a 4 punte smooth con bezier
    Centro (256,256), punta lunga R=192, indent interno r=58
  -->
  <g filter="url(#starGlow)">
    <path d="
      M 256,64
      C 256,198 198,256 64,256
      C 198,256 256,314 256,448
      C 256,314 314,256 448,256
      C 314,256 256,198 256,64
      Z"
      fill="url(#starGrad)"/>
  </g>

  <!-- Core luminoso al centro -->
  <circle cx="256" cy="256" r="32" fill="#fffde0" opacity="0.92" filter="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="1"/>

  <!-- Stella satellite piccola — alto destra -->
  <g filter="url(#smallGlow)">
    <path d="
      M 372,122
      C 372,148 354,152 328,162
      C 354,162 372,176 372,202
      C 372,176 390,162 416,162
      C 390,162 372,148 372,122
      Z"
      fill="#D4AF37" opacity="0.88"/>
    <circle cx="372" cy="162" r="5" fill="#fff" opacity="0.90"/>
  </g>

  <!-- Stella satellite piccola — basso sinistra -->
  <g filter="url(#smallGlow)">
    <path d="
      M 140,310
      C 140,328 130,330 112,338
      C 130,338 140,346 140,364
      C 140,346 150,338 168,338
      C 150,338 140,328 140,310
      Z"
      fill="#D4AF37" opacity="0.72"/>
    <circle cx="140" cy="338" r="4" fill="#fff" opacity="0.80"/>
  </g>

  <!-- Punto luce sparso -->
  <circle cx="390" cy="340" r="3.5" fill="#f5d776" opacity="0.55" filter="url(#smallGlow)"/>
  <circle cx="120" cy="175" r="2.5" fill="#f5d776" opacity="0.45" filter="url(#smallGlow)"/>
</svg>
