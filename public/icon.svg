<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sfondo con angoli arrotondati -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Alone viola sfumato al centro -->
  <ellipse cx="256" cy="270" rx="160" ry="130" fill="#7c3aed" opacity="0.12"/>

  <!-- Fulmine principale -->
  <g filter="url(#glow)">
    <path d="M295 90 L175 280 H248 L215 422 L355 210 H275 L310 90 Z"
          fill="url(#bolt)" opacity="0.95"/>
  </g>

  <!-- Riflesso / highlight sul fulmine -->
  <path d="M295 90 L256 170 H278 L255 230 L310 155 H288 L310 90 Z"
        fill="white" opacity="0.18"/>

  <!-- Piccoli punti luce decorativi -->
  <circle cx="155" cy="155" r="4" fill="#c084fc" opacity="0.6" filter="url(#softglow)"/>
  <circle cx="370" cy="195" r="3" fill="#a78bfa" opacity="0.5" filter="url(#softglow)"/>
  <circle cx="140" cy="350" r="5" fill="#7c3aed" opacity="0.4" filter="url(#softglow)"/>
  <circle cx="385" cy="340" r="3" fill="#c084fc" opacity="0.4" filter="url(#softglow)"/>
</svg>
