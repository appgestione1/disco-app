<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>
    <radialGradient id="ball" cx="36%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#fffde7"/>
      <stop offset="20%"  stop-color="#f5d776"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="80%"  stop-color="#9a7820"/>
      <stop offset="100%" stop-color="#5c4610"/>
    </radialGradient>
    <radialGradient id="tileA" cx="25%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="tileB" cx="25%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5c4610" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <circle cx="256" cy="295" r="168"/>
    </clipPath>
  </defs>

